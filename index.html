<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando generador IA...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #22c55e;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: none;
            background-color: #22c55e;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .ad-container {
            margin: 20px 0;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tu enlace se está preparando...</h1>
        <p id="status-text">Generando entorno de desarrollo con IA en <span id="countdown">5</span>s</p>
        
        <div class="spinner" id="loading-spinner"></div>

        <!-- Espacio para el Banner de Adsterra (300x250) -->
        <div class="ad-container">
            <!-- Inserta aquí el código de tu banner de Adsterra cuando lo necesites -->
        </div>

        <a href="https://v0.dev/" id="target-btn" class="btn">Continuar al enlace</a>
    </div>

    <!-- Script para Popunder / Social Bar de Adsterra (si procede) -->
    <!-- Pega aquí los scripts adicionales de Adsterra si los requieres -->

    <script>
        // Temporizador de cuenta atrás de 5 segundos
        var seconds = 5;
        var countdownElement = document.getElementById("countdown");
        var spinnerElement = document.getElementById("loading-spinner");
        var statusText = document.getElementById("status-text");
        var targetBtn = document.getElementById("target-btn");

        var timer = setInterval(function() {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                spinnerElement.style.display = "none";
                statusText.innerHTML = "<span style='color: #22c55e; font-weight: bold;'>¡Listo!</span>";
                targetBtn.style.display = "inline-block";
                
                // Redirección automática opcional a los 5 segundos exactos
                window.location.href = "https://v0.dev/";
            }
        }, 1000);
    </script>

</body>
</html>
